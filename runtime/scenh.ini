; Opciones del runtime de mejoras de Space Clash (scenh.dll). Se lee al arrancar CLASH.EXE y SPACE.EXE.
; Cada mejora se puede desactivar con 0; con [general] activar=0 el juego queda como el original.

[general]
activar=1
; Avisos breves en pantalla (p. ej. "VELOCIDAD X2")
avisos=1
; Registro de lo aplicado y lo rechazado en scenh.log
log=1

[velocidad]
activar=1
; Teclas + y - (fila principal o teclado numérico) para cambiar la velocidad: 50, 75, 100, 150, 200, 300 %.
; En multijugador la velocidad queda fija.
teclas=1
; Velocidad al arrancar, en % (se guarda la última elegida)
inicial=100

[cpu]
; Dormir 1 ms entre fotogramas cuando sobra tiempo: el original ocupa un núcleo entero al 100 %
ahorro=1

[cursor]
; Dibujar el cursor en cada fotograma antes de presentarlo: el original parpadea con cnc-ddraw y Wine
sin_parpadeo=1

[pantalla]
; Omitir los cambios de modo de pantalla que no cambian nada (cnc-ddraw los pide igual). Wine los anuncia a
; todas las ventanas y, como CLASH.EXE no responde mientras espera a SPACE.EXE, cada traspaso entre la
; parte planetaria y el mapa estelar quedaba unos 6 s en negro.
sin_cambio_de_modo_inutil=1
; Espera al cerrar SPACE.EXE (al pasar del mapa estelar a una misión) y al salir del juego, en ms.
; El original espera 2000 ms con la pantalla en negro.
espera_al_cerrar_ms=100

[autoguardado]
; Guardar al empezar cada misión (no en multijugador). Ranura 0–9 de la lista de partidas (9 = la última).
; Solo se usa si está vacía o ya es un autoguardado ("AUTO - ..."): una partida tuya ahí no se pisa.
activar=1
ranura=9

[guardado_rapido]
; F12 guarda la partida y Ctrl+F12 carga la última guardada así (parte planetaria y mapa estelar), en
; partida y sin ventanas abiertas. Ranura 0–9 de la lista (8 = la novena); aparece como "RAPIDA - ...".
; Una partida tuya en esa ranura no se pisa. Tecla: código de tecla virtual (123 = F12).
activar=1
ranura=8
tecla=123

[desplazamiento]
; Flechas del teclado: mueven la cámara como el ratón en el borde de la pantalla (parte planetaria y mapa
; estelar). Con una ventana abierta siguen siendo del juego (listas).
flechas=1

[grupos]
; Ctrl+0–9 guarda la selección y 0–9 la recupera (en la parte planetaria ya existía; se añade en el mapa
; estelar). Pulsar dos veces seguidas el número lleva además la cámara al grupo.
activar=1

[zoom]
; Rueda del ratón durante la partida planetaria y en el mapa estelar: adelante acerca (640x480), atrás
; aleja (1024x768 o la resolución de [resolucion]). No funciona en pausa ni en multijugador.
activar=1

[resolucion]
; EXPERIMENTAL (parte planetaria): reemplaza el modo 1024x768 del juego (Opciones → 1024) por este
; tamaño, para ver más mapa. Ancho de 1024 a 2560 (múltiplo de 8), alto de 600 a 1600 y área de al
; menos 1024x768 (p. ej. 1280x720, 1366x768 no: 1360x768 sí, 1920x1080).
activar=0
ancho=1280
alto=720
; HUD centrado abajo (1) o pegado a la izquierda como en el original (0)
centrar_hud=1
