; Opciones del runtime de mejoras de Space Clash (scenh.dll). Se lee al arrancar CLASH.EXE y SPACE.EXE.
; Cada mejora se puede desactivar con 0; con [general] activar=0 el juego queda como el original.

[general]
activar=1
; Avisos breves en pantalla (p. ej. "VELOCIDAD X2")
avisos=1
; Registro de lo aplicado y lo rechazado en scenh.log
log=1

[velocidad]
activar=1
; Teclas + y - (fila principal o teclado numérico) para cambiar la velocidad: 50, 75, 100, 150, 200, 300 %.
; En multijugador la velocidad queda fija.
teclas=1
; Velocidad al arrancar, en % (se guarda la última elegida)
inicial=100

[cpu]
; Dormir 1 ms entre fotogramas cuando sobra tiempo: el original ocupa un núcleo entero al 100 %
ahorro=1

[zoom]
; Rueda del ratón durante la partida planetaria: adelante acerca (640x480), atrás aleja (1024x768 o la
; resolución de [resolucion]). No funciona en pausa ni en multijugador.
activar=1

[resolucion]
; EXPERIMENTAL (parte planetaria): reemplaza el modo 1024x768 del juego (Opciones → 1024) por este
; tamaño, para ver más mapa. Ancho de 1024 a 2560 (múltiplo de 8), alto de 600 a 1600 y área de al
; menos 1024x768 (p. ej. 1280x720, 1366x768 no: 1360x768 sí, 1920x1080).
activar=0
ancho=1280
alto=720
; HUD centrado abajo (1) o pegado a la izquierda como en el original (0)
centrar_hud=1
